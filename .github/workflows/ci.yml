name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile
        run: python -m compileall -q mira tests

      - name: Feature registry
        run: python -m mira.feature_registry check FEATURES.md

      - name: Work-session alignment
        run: python -m mira.work_session_alignment check

      - name: Code ownership
        run: python -m mira.code_ownership check

      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Workspace Apps Script tests
        run: node --test tests/apps_script/*.test.js
