name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compile
        run: python -m compileall -q mira tests project/android_code_ownership.py

      - name: Feature registry
        run: python -m mira.feature_registry check FEATURES.md

      - name: Product lifecycle ledger
        run: python -m mira.product_ledger check

      - name: Personal starter distribution
        run: |
          python -m mira.personal_distribution check
          SOURCE_SHA="$(git rev-parse HEAD)"
          python -m mira.personal_distribution manifest "$SOURCE_SHA" > /tmp/mira-release-1.json
          python -m mira.personal_distribution manifest "$SOURCE_SHA" > /tmp/mira-release-2.json
          diff -u /tmp/mira-release-1.json /tmp/mira-release-2.json
          python -m mira.personal_distribution verify-manifest /tmp/mira-release-1.json

      - name: Work-session alignment
        run: python -m mira.work_session_alignment check

      - name: Code ownership
        run: |
          python -m mira.code_ownership check
          python project/android_code_ownership.py check

      - name: Android client core unit tests
        run: gradle -p android-client :core:testDebugUnitTest --stacktrace

      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Workspace Apps Script tests
        run: node --test tests/apps_script/*.test.js
