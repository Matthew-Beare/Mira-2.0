name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m compileall -q mira tests

      - name: Feature registry
        run: python -m mira.feature_registry check FEATURES.md

      - name: Code ownership
        run: python -m mira.code_ownership check

      - name: Unit tests
        run: python -m unittest discover -s tests -v
